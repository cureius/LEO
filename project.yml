name: LEO
options:
  bundleIdPrefix: com.leo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  groupSortPosition: top
  generateEmptyDirectories: true
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.leo.app
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

targets:
  LEO:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LEO
        excludes:
          - "**/.gitkeep"
    resources:
      - LEO/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leo.app
        INFOPLIST_FILE: LEO/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LEO/Resources/LEO.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: targeted
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    entitlements:
      path: LEO/Resources/LEO.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.leo.app
        com.apple.developer.cloudkit.development-containers-identifiers:
          - iCloud.com.leo.app
        com.apple.security.application-groups:
          - group.com.leo.app
        aps-environment: development
        com.apple.developer.usernotifications.communication: true
    info:
      path: LEO/Resources/Info.plist
      properties:
        CFBundleName: LEO
        CFBundleDisplayName: LEO
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
          - processing
          - location
        BGTaskSchedulerPermittedIdentifiers:
          - com.leo.refresh
          - com.leo.processing
        NSCalendarsUsageDescription: "LEO syncs with your iOS calendars to show everything in one place."
        NSCalendarsWriteOnlyAccessUsageDescription: "LEO creates events in your iOS calendars."
        NSRemindersUsageDescription: "LEO syncs with your reminders to show everything in one place."
        NSLocationWhenInUseUsageDescription: "LEO uses your location for location-based reminders."
        NSLocationAlwaysAndWhenInUseUsageDescription: "LEO uses your location for location-based reminders even when the app is in the background."
        NSMicrophoneUsageDescription: "LEO uses the microphone for voice quick-add."
        NSSpeechRecognitionUsageDescription: "LEO uses speech recognition to convert your voice to captured items."
        NSUserTrackingUsageDescription: "LEO does not track you. This entry is required by iOS."

  LEOTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LEOTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: LEO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leo.tests
        SWIFT_STRICT_CONCURRENCY: targeted

  LEOUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LEOUITests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: LEO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leo.uitests
        TEST_TARGET_NAME: LEO
