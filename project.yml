name: LEO
options:
  bundleIdPrefix: com.leo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  groupSortPosition: top
  generateEmptyDirectories: true
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
  defaultConfig: Debug
  createIntermediateGroups: true

schemes:
  LEO:
    build:
      targets:
        LEO: all
        LEOWidgets: [build]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LEOTests, LEOUITests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.theblueman.leo
    DEVELOPMENT_TEAM: ZT397U24CA
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

targets:
  LEO:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LEO
        excludes:
          - "**/.gitkeep"
    resources:
      - LEO/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theblueman.leo
        INFOPLIST_FILE: LEO/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: targeted
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGN_ENTITLEMENTS: LEO/Resources/LEO-debug.entitlements
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          CODE_SIGN_ENTITLEMENTS: LEO/Resources/LEO.entitlements
    dependencies:
      - target: LEOWidgets
        embed: true
    info:
      path: LEO/Resources/Info.plist
      properties:
        CFBundleName: LEO
        CFBundleDisplayName: LEO
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: "Background"
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - remote-notification
          - processing
          - location
        BGTaskSchedulerPermittedIdentifiers:
          - com.theblueman.leo.refresh
          - com.theblueman.leo.processing
        NSCalendarsUsageDescription: "LEO syncs with your iOS calendars to show everything in one place."
        NSCalendarsWriteOnlyAccessUsageDescription: "LEO creates events in your iOS calendars."
        NSRemindersUsageDescription: "LEO syncs with your reminders to show everything in one place."
        NSLocationWhenInUseUsageDescription: "LEO uses your location for location-based reminders."
        NSLocationAlwaysAndWhenInUseUsageDescription: "LEO uses your location for location-based reminders even when the app is in the background."
        NSCameraUsageDescription: "LEO uses the camera so you can photograph handwritten notes and convert them to tasks and events."
        NSMicrophoneUsageDescription: "LEO uses the microphone for voice quick-add."
        NSPhotoLibraryUsageDescription: "LEO reads photos so you can convert handwritten notes into tasks and events."
        NSSpeechRecognitionUsageDescription: "LEO uses speech recognition to convert your voice to captured items."
        NSUserTrackingUsageDescription: "LEO does not track you. This entry is required by iOS."

  LEOWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LEOWidgets
        excludes:
          - "**/.gitkeep"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theblueman.leo.widgets
        INFOPLIST_FILE: LEOWidgets/Info.plist
        SWIFT_STRICT_CONCURRENCY: targeted
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: LEOWidgets/LEOWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.theblueman.leo

  LEOTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LEOTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: LEO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theblueman.leo.tests
        SWIFT_STRICT_CONCURRENCY: targeted

  LEOUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LEOUITests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: LEO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theblueman.leo.uitests
        TEST_TARGET_NAME: LEO
